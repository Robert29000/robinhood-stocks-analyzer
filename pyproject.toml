[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "robinhood-stocks-activity"
version = "0.1.0"
description = "Correlate Robinhood stock-token multiplier, issuance, and Uniswap activity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "web3>=7,<9",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "matplotlib>=3.8", "pandas>=2.2", "pandas-market-calendars>=4.4,<6", "yfinance>=0.2.40"]
test = ["pytest>=8"]

[project.scripts]
stock-activity = "stock_activity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_activity"]

[tool.hatch.build.targets.wheel.force-include]
"abis" = "stock_activity/abis"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: opt-in tests against live external services"]
